name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # HOOK-13: temporary files on the work volume, not the OS disk (docs/development/hook-startup.md).
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run doctor
      - id: check
        run: npm run check
      # Diagnostic only, after the unchanged gate; profiler overhead is never a budget result.
      - name: Diagnose process startup and populated resume
        if: always() && runner.os == 'Windows' && steps.check.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/benchmark-hook.mjs --resume --load --profile
