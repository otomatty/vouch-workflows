name: Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/benchmark.yml
      - scripts/benchmark-*.mjs
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    # Diagnostic only: raw samples for the runner, never a budget gate.
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/benchmark-hook.mjs | tee benchmark-hook.json
      - run: node scripts/benchmark-hook.mjs --load | tee benchmark-hook-load.json
      - run: node scripts/benchmark-audit.mjs | tee benchmark-audit.json
      - run: node scripts/benchmark-shell.mjs | tee benchmark-shell.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-node-${{ matrix.node }}
          path: benchmark-*.json
